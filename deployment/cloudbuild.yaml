steps:
  # 1. Build Docker image with Playwright & Chromium
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/job-agent-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/job-agent-backend:latest', './backend']

  # 2. Push image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/job-agent-backend:latest']

  # 3. Deploy to Cloud Run (asia-south1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'job-agent-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/job-agent-backend:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--session-affinity'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/job-agent-backend:latest'
