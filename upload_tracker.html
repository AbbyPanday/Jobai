<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="2" />
  <title>GitHub Upload Tracker — Jobai</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:40px;width:620px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
    .header{display:flex;align-items:center;gap:14px;margin-bottom:32px}
    .github-icon{width:40px;height:40px;fill:#e6edf3}
    .title-group h1{font-size:20px;font-weight:600}
    .title-group p{font-size:13px;color:#8b949e;margin-top:2px}
    .status-badge{margin-left:auto;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.5px}
    .status-uploading{background:#1f3a5f;color:#58a6ff;border:1px solid #1f6feb;animation:pulse 1.5s infinite}
    .status-done{background:#1a3a2a;color:#3fb950;border:1px solid #238636}
    .status-error{background:#3a1a1a;color:#f85149;border:1px solid #da3633}
    .status-waiting{background:#21262d;color:#8b949e;border:1px solid #30363d}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
    .stat-box{background:#21262d;border:1px solid #30363d;border-radius:10px;padding:16px;text-align:center}
    .stat-box .number{font-size:28px;font-weight:700;line-height:1}
    .stat-box .label{font-size:12px;color:#8b949e;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
    .stat-box.total .number{color:#e6edf3}
    .stat-box.success .number{color:#3fb950}
    .stat-box.failed .number{color:#f85149}
    .progress-section{margin-bottom:24px}
    .progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .progress-header span{font-size:13px;color:#8b949e}
    .progress-header .pct{font-size:22px;font-weight:700;color:#58a6ff}
    .progress-bar-bg{height:10px;background:#21262d;border-radius:99px;overflow:hidden;border:1px solid #30363d}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,#1f6feb,#58a6ff);border-radius:99px;position:relative;overflow:hidden}
    .progress-bar-fill::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 1.5s infinite}
    @keyframes shimmer{0%{left:-100%}100%{left:100%}}
    .current-file{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:12px 16px;font-size:12px;color:#8b949e;font-family:'Courier New',monospace;margin-bottom:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .current-file span{color:#58a6ff}
    .file-list{max-height:180px;overflow-y:auto;border:1px solid #30363d;border-radius:8px;scrollbar-width:thin;scrollbar-color:#30363d #161b22}
    .file-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #21262d;font-size:12px;font-family:'Courier New',monospace}
    .file-item:last-child{border-bottom:none}
    .file-item.ok{color:#3fb950}.file-item.fail{color:#f85149}
    .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .dot.ok{background:#3fb950}.dot.fail{background:#f85149}
    .footer{margin-top:20px;text-align:center;font-size:11px;color:#484f58}
    .footer a{color:#58a6ff;text-decoration:none}
    .refresh-note{font-size:11px;color:#484f58;text-align:right;margin-top:8px}
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <svg class="github-icon" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    <div class="title-group">
      <h1>AbbyPanday / Jobai</h1>
      <p>Pushing to github.com/AbbyPanday/Jobai</p>
    </div>
    <span class="status-badge status-uploading">UPLOADING...</span>
  </div>
  <div class="stats-row">
    <div class="stat-box total"><div class="number">76</div><div class="label">Total Files</div></div>
    <div class="stat-box success"><div class="number">3</div><div class="label">Uploaded</div></div>
    <div class="stat-box failed"><div class="number">0</div><div class="label">Failed</div></div>
  </div>
  <div class="progress-section">
    <div class="progress-header"><span>Upload Progress</span><span class="pct">4%</span></div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:4%"></div></div>
  </div>
  <div class="current-file"><span>▶</span> SPECIFICATION.md</div>
  <div class="file-list"><div class='file-item ok'><div class='dot ok'></div>SPECIFICATION.md</div><div class='file-item ok'><div class='dot ok'></div>.gitignore</div><div class='file-item ok'><div class='dot ok'></div>.env.example</div></div>
  <div class="refresh-note">🔄 Auto-refreshing every 2s</div>
  <div class="footer"><a href="https://github.com/AbbyPanday/Jobai" target="_blank">View on GitHub →</a></div>
</div>
</body></html>
